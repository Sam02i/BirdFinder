services:
  - type: web
    name: birdfinder
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: MPLBACKEND
        value: Agg
      - key: OMP_NUM_THREADS
        value: '1'
